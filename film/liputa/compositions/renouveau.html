    tl.fromTo("#rn-tel", { y: 1100 }, { y: 0, duration: 0.7, ease: "expo.out" }, 0.0);

    flips.forEach(([sel, t]) => {
      tl.fromTo(sel, { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, Math.max(0.1, t - 1.5));
      tl.to(`${sel}-p`, { rotationX: 90, opacity: 0, duration: 0.18, ease: "power2.in" }, t);
      tl.fromTo(`${sel}-c`, { opacity: 0, rotationX: -90 }, { opacity: 1, rotationX: 0, duration: 0.25, ease: "back.out(1.6)", immediateRender: false }, t + 0.18);
    });

    // Les écrans de Liputa défilent au rythme de la voix.
    tl.to("#rn-essayage", { opacity: 0, x: -120, duration: 0.25, ease: "power3.in" }, 4.4);
    tl.fromTo("#rn-patron", { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, 4.5);
    tl.fromTo("#rn-patron-rep", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 5.4);
    tl.to("#rn-patron", { opacity: 0, x: -120, duration: 0.25, ease: "power3.in" }, 7.3);
    tl.fromTo("#rn-planning", { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, 7.4);

    tl.to("#rn-planning", { opacity: 0, x: -120, duration: 0.25, ease: "power3.in" }, 9.7);
