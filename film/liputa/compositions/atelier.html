  <script>
    LiputaRig.draw(document.querySelector("#at-nadege"), { kind: "nadege", id: "an" });
    LiputaRig.draw(document.querySelector("#at-chantal"), { kind: "chantal", id: "ac" });
    const tl = gsap.timeline({ paused: true });
    const R = LiputaRig;
    const NOTES = ["#at-n1", "#at-n2", "#at-n3", "#at-n4", "#at-n5", "#at-n6", "#at-n7", "#at-n8"];
        tl.set("#at-chantal", { x: 320 }, 0);

    // 0–4 s : « Kinshasa » se pose sur la ville, la caméra glisse dans l'atelier.
    tl.fromTo("#at-scene", { scale: 1.12 }, { scale: 1, duration: 4.2, ease: "power2.out" }, 0);
    tl.fromTo("#at-titre span", { opacity: 0, y: 80, rotation: 6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, stagger: 0.06, ease: "back.out(1.6)" }, 0.25);
    tl.fromTo("#at-sous", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.2);
    tl.to("#at-carton", { opacity: 0, duration: 0.45, ease: "power2.in" }, 4.1);
    tl.to(["#at-titre", "#at-sous"], { y: -90, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.1);

    // Nadège coud, tranquille : elle respire, elle cligne des yeux, elle regarde son ouvrage.
    R.breathe(tl, "an", 0, 21);
    R.blinks(tl, "an", [1.6, 4.4, 7.9, 10.6, 13.2, 16.4, 19.1]);
    R.look(tl, "an", -6, 8, 0.2);
    tl.to("#an-armL", { rotation: -8, duration: 0.5, ease: "sine.inOut" }, 1.0);
    tl.to("#an-armL", { rotation: 0, duration: 0.5, ease: "sine.inOut" }, 2.0);
    tl.to("#an-armL", { rotation: -8, duration: 0.5, ease: "sine.inOut" }, 3.0);
    tl.to("#an-armL", { rotation: 0, duration: 0.5, ease: "sine.inOut" }, 4.0);

    // 5,9–14,2 s : l'atelier étouffe. Appels et papiers s'abattent de plus en plus vite.
    R.mood(tl, "an", "inquiete", 6.0);
    R.look(tl, "an", 8, -4, 6.0);
    const arrivals = [6.2, 7.3, 8.2, 8.9, 9.6, 10.2, 10.7, 11.15];
    NOTES.forEach((sel, i) => {
      const fromX = i % 2 ? 900 : -900;
      tl.fromTo(sel, { opacity: 0, x: fromX, scale: 0.8 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, arrivals[i]);
      R.look(tl, "an", i % 2 ? 9 : -9, -2, arrivals[i] + 0.1);
    });
    // Elle porte les mains à sa tête.
    tl.to("#an-armL", { rotation: 118, duration: 0.45, ease: "back.out(1.4)" }, 9.4);
    tl.to("#an-armR", { rotation: -118, duration: 0.45, ease: "back.out(1.4)" }, 9.5);
    tl.to("#an-head", { rotation: -5, duration: 0.18, ease: "sine.inOut" }, 12.4);
    tl.to("#an-head", { rotation: 5, duration: 0.18, ease: "sine.inOut" }, 12.58);
    tl.to("#an-head", { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 12.76);
    // Les clientes passent et repassent : la porte s'ouvre, des silhouettes traversent.
    tl.to("#at-battant", { scaleX: 0.08, duration: 0.4, ease: "power2.out" }, 10.4);
    [["#at-passant-1", 10.8], ["#at-passant-2", 11.6], ["#at-passant-3", 12.3]].forEach(([sel, t], i) => {
      tl.fromTo(sel, { opacity: 1, x: i % 2 ? -330 : 0 }, { x: i % 2 ? 0 : -330, duration: 0.9, ease: "none", immediateRender: false }, t);
      tl.set(sel, { opacity: 0 }, t + 0.9);
    });

    // 14,6–17,5 s : Chantal à la porte, inquiète.
    tl.to(NOTES, { opacity: 0.25, duration: 0.4, ease: "power2.inOut" }, 14.2);
    tl.to("#an-armL", { rotation: 0, duration: 0.45, ease: "power2.inOut" }, 14.3);
    tl.to("#an-armR", { rotation: 0, duration: 0.45, ease: "power2.inOut" }, 14.35);
    tl.to("#at-chantal", { x: 0, duration: 0.5, ease: "power3.out" }, 14.4);
    R.mood(tl, "ac", "inquiete", 14.5);
    R.look(tl, "an", 14, 0, 14.6);
    R.look(tl, "ac", -12, 0, 14.6);
    R.talk(tl, "ac", 14.65, 17.4, "inquiete");
    tl.fromTo("#at-bulle-chantal", { opacity: 0, scale: 0.6, transformOrigin: "80% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 15.6);
    R.blinks(tl, "ac", [15.2, 17.0]);

    // 17,9–20,7 s : Nadège promet avec un sourire forcé… puis le doute.
    tl.to("#at-bulle-chantal", { opacity: 0, duration: 0.2 }, 17.8);
    tl.to(NOTES, { opacity: 0, duration: 0.25, ease: "power2.in" }, 17.8);
    R.mood(tl, "an", "sourire", 18.0);
    tl.to("#an-head", { rotation: 4, duration: 0.15, ease: "sine.inOut" }, 18.1);
    tl.to("#an-head", { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 18.25);
    tl.fromTo("#at-bulle-nadege", { opacity: 0, scale: 0.6, transformOrigin: "20% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 18.1);
    R.mood(tl, "ac", "sourire", 18.5);
    tl.to("#at-bulle-nadege", { opacity: 0, duration: 0.2 }, 19.4);
    tl.to("#at-chantal", { x: 320, duration: 0.6, ease: "power2.in" }, 19.4);
    tl.to("#at-battant", { scaleX: 1, duration: 0.4, ease: "power2.in" }, 19.9);
    R.mood(tl, "an", "inquiete", 19.8);
    R.look(tl, "an", 0, 10, 19.8);
    tl.to("#an-head", { rotation: -7, y: 10, duration: 0.6, ease: "power2.inOut" }, 19.9);

    // 20,6–21,8 s : la nuit tombe sur l'atelier.
    tl.to("#at-nuit", { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 20.7);
    window.__timelines["atelier"] = tl;
  </script>
