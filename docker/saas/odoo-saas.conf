[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; À CHANGER avant la mise en ligne (mot de passe maître des bases).
admin_passwd = change-moi-mot-de-passe-maitre
dbfilter = ^selecta$
list_db = False
; Derrière le proxy HTTPS : adresse IP réelle des visiteurs (limitation des tentatives) et URL en https.
proxy_mode = True
; Dimensionnement indicatif : (2 × cœurs) + 1 workers ; valider par un test de charge avant un grand concours.
workers = 5
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 600
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
